name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # 后端契约基线:指向已推送到 xuanshiai 仓库 main 的提交;更新前端交付时须同步更新此 SHA。
  BACKEND_CONTRACT_SHA: ce72b9e10e683cf9681606325ee9e8a0ba961350

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout backend contract
        uses: actions/checkout@v4
        with:
          repository: kx-learn/xuanshiai
          ref: ${{ env.BACKEND_CONTRACT_SHA }}
          path: backend-contract
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Record both repository HEADs
        run: |
          echo "frontend HEAD: $(git rev-parse HEAD)"
          echo "backend contract HEAD: $(git -C backend-contract rev-parse HEAD)"
          echo "backend contract requested: $BACKEND_CONTRACT_SHA"
          test "$(git -C backend-contract rev-parse HEAD)" = "$BACKEND_CONTRACT_SHA"
      - name: Validate versioned authoritative documents
        run: node scripts/authoritative-docs.cjs --check
      - name: Validate frontend source
        env:
          XSA_BACKEND_ROOT: backend-contract
        run: npm test
      - name: Record manual release blocker
        if: always()
        run: |
          echo "::warning::源码 CI 不认证发布：当前没有自动 HBuilderX 产物流水线，端侧验收仍为人工发布阻塞项。"
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## 发布验收未通过（人工阻塞）
          本 workflow 仅验证源码与版本化权威文档，不生成或下载 mp-weixin 产物。
          必须按 docs/HOW_TO_RUN.md#发布验收门禁 从目标前端 SHA 的干净检出用 HBuilderX 编译，
          记录产物摘要，实际执行 verify:mp、test:artifact，并提供微信工具/真机及多宽度证据。
          缺产物或任何 artifact SKIP 均失败；没有端侧记录不得发布。
          EOF
