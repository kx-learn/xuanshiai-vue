name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Checkout backend contract
        uses: actions/checkout@v4
        with:
          repository: kx-learn/xuanshiai
          path: backend-contract

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate frontend source
        env:
          XSA_BACKEND_ROOT: backend-contract
        run: npm test
